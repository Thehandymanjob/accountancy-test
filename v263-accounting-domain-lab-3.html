<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THA v263 Accounting Domain Lab 3</title>
<style>
body{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#172235}
h1{font-size:23px}button{background:#142b4a;color:#fff;border:0;border-radius:8px;padding:14px 18px;font-size:16px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f9;border:1px solid #dce2ea;border-radius:10px;padding:12px;min-height:150px}
.muted{color:#657286}
</style></head><body>
<h1>THA v263 — Accounting Domain Stress & Validation Lab</h1>
<p class="muted">LAB-3 · Synthetic records only · dedicated IndexedDB database · no LocalStorage, no legacy import, no production access.</p>
<p><button id="run">Run advanced accounting tests</button></p>
<pre id="out">Ready. Tap Run advanced accounting tests.</pre>
<script src="storage-idb-v263-accounting-domain-engine.js"></script>
<script src="app-storage-v263-v4.js"></script>
<script src="v263-accounting-controller.js"></script>
<script src="v263-invoice-workflow-v263.js"></script>
<script>
(function(){
 "use strict";
 const $=id=>document.getElementById(id),checks=[];
 function check(name,ok,detail){checks.push({check:name,ok:!!ok,detail:String(detail||"")});}
 async function expectReject(fn,pattern){
  try{await fn();return {rejected:false,message:"operation unexpectedly succeeded"};}
  catch(e){return {rejected:pattern?pattern.test(String(e&&e.message||e)):true,message:String(e&&e.message||e)};}
 }
 async function run(){
  checks.length=0;$("run").disabled=true;$("out").textContent="Running advanced checks…";
  const report={title:"THA v263 Advanced Accounting Domain Report",build:"THA-263-ACCOUNTING-DOMAIN-LAB-3",createdAt:new Date().toISOString(),database:"tha_v263_accounting_domain_lab_20261109_idb",syntheticDataOnly:true,legacyStorageAccess:false,productionAccess:false,checks};
  try{
   await HandymanAccountingV263.initialize();
   const token="acct-lab3-"+Date.now(),customerId=token+"-customer";
   await HandymanAccountingV263.saveCustomer({id:customerId,name:"Synthetic Advanced Customer",phone:"0000000000",address:"Test only",customCustomerField:{source:"lab3"}});
   const customer= (await HandymanAccountingV263.load()).customers.find(x=>x.id===customerId);
   check("Customer unknown fields survive IndexedDB round-trip",!!customer&&customer.customCustomerField?.source==="lab3","custom field preserved="+!!customer?.customCustomerField);
   
   const reservations=await Promise.all(Array.from({length:20},()=>HandymanAccountingV263.reserveInvoiceNumber()));
   const unique=[...new Set(reservations)].length===20;
   const sorted=reservations.slice().sort((a,b)=>a-b);
   const contiguous=sorted.every((n,i)=>i===0||n===sorted[i-1]+1);
   check("20 concurrent invoice-number reservations are unique and contiguous",unique&&contiguous,"reserved="+sorted.join(",")+"; unique="+unique+"; contiguous="+contiguous);
   const afterCounter=await HandymanAccountingV263.reserveInvoiceNumber();
   check("Invoice counter remains above all concurrent reservations",afterCounter>Math.max(...reservations),"next="+afterCounter+"; max="+Math.max(...reservations));
   
   const invoiceId=token+"-invoice",attachment=new Blob(["THA synthetic attachment payload"],{type:"text/plain"});
   const first=await HandymanInvoiceWorkflowV263.saveInvoice({id:invoiceId,customerId,number:null,date:"2026-11-09",status:"draft",paymentStatus:"unpaid",items:[{description:"Synthetic service",price:250}],customMetadata:{origin:"lab3",revision:1},attachment});
   let state=await HandymanAccountingV263.load(),stored=state.invoices.find(x=>x.id===invoiceId);
   const blobText=stored?.attachment instanceof Blob?await stored.attachment.text():"";
   check("Invoice attachment Blob and unknown metadata survive save/read",!!stored&&blobText==="THA synthetic attachment payload"&&stored.customMetadata?.revision===1,"blob="+(stored?.attachment instanceof Blob)+"; blobBytes="+(stored?.attachment?.size||0)+"; metadata="+(stored?.customMetadata?.revision||"missing"));
   
   const edited={...stored,items:[{description:"Edited synthetic service",price:275}],customMetadata:{origin:"lab3",revision:2}};
   const edit=await HandymanInvoiceWorkflowV263.saveInvoice(edited);
   state=await HandymanAccountingV263.load();stored=state.invoices.find(x=>x.id===invoiceId);
   check("Invoice edit preserves number and updates content",edit.number===first.number&&stored.number===first.number&&stored.items[0].price===275&&stored.customMetadata.revision===2,"number="+stored.number+"; amount="+stored.items[0].price+"; revision="+stored.customMetadata.revision);
   
   const changeNumber=await expectReject(()=>HandymanInvoiceWorkflowV263.saveInvoice({...stored,number:stored.number+500}),/number cannot be changed/i);
   state=await HandymanAccountingV263.load();stored=state.invoices.find(x=>x.id===invoiceId);
   check("Changing an existing invoice number is rejected without mutation",changeNumber.rejected&&stored.number===first.number,"rejected="+changeNumber.rejected+"; message="+changeNumber.message+"; currentNumber="+stored.number);
   
   const duplicateId=token+"-duplicate-invoice";
   const duplicate=await expectReject(()=>HandymanInvoiceWorkflowV263.saveInvoice({id:duplicateId,customerId,number:first.number,date:"2026-11-09",items:[]}),/already in use/i);
   state=await HandymanAccountingV263.load();
   check("Duplicate invoice number is rejected",duplicate.rejected&&!state.invoices.some(x=>x.id===duplicateId),"rejected="+duplicate.rejected+"; message="+duplicate.message);
   
   const badMethod=await expectReject(()=>HandymanInvoiceWorkflowV263.markPaid(invoiceId,{date:"2026-11-09",method:"cheque",amount:275}),/valid payment/i);
   const badAmount=await expectReject(()=>HandymanInvoiceWorkflowV263.markPaid(invoiceId,{date:"2026-11-09",method:"cash",amount:0}),/valid payment/i);
   state=await HandymanAccountingV263.load();stored=state.invoices.find(x=>x.id===invoiceId);
   check("Invalid payment method and zero amount are rejected without mutation",badMethod.rejected&&badAmount.rejected&&stored.paymentStatus!=="paid"&&!state.entries.some(x=>x.invoiceId===invoiceId),"methodRejected="+badMethod.rejected+"; amountRejected="+badAmount.rejected+"; paymentStatus="+stored.paymentStatus);
   
   const missingCustomer=await expectReject(()=>HandymanInvoiceWorkflowV263.saveInvoice({id:token+"-orphan",customerId:token+"-missing",number:null,date:"2026-11-09",items:[]}),/customer does not exist/i);
   state=await HandymanAccountingV263.load();
   check("Invoice with unknown customer is rejected",missingCustomer.rejected&&!state.invoices.some(x=>x.id===token+"-orphan"),"rejected="+missingCustomer.rejected+"; message="+missingCustomer.message);
   
   const entryId=token+"-entry";
   await HandymanAccountingV263.addEntry({id:entryId,type:"expense",date:"2026-11-09",amount:8,method:"cash",category:"Lab",customAudit:{tag:"keep-me"}});
   await HandymanAccountingV263.updateEntry(entryId,{amount:9,notes:"edited"});
   state=await HandymanAccountingV263.load();const entry=state.entries.find(x=>x.id===entryId);
   check("Entry edit preserves stable ID and unknown fields",!!entry&&entry.id===entryId&&entry.amount===9&&entry.customAudit?.tag==="keep-me","idPreserved="+(entry?.id===entryId)+"; amount="+entry?.amount+"; customField="+entry?.customAudit?.tag);
   
   await HandymanInvoiceWorkflowV263.markPaid(invoiceId,{date:"2026-11-09",method:"bank",amount:275});
   state=await HandymanAccountingV263.load();
   const linkedBefore=state.entries.filter(x=>x.invoiceId===invoiceId);
   const linkedDelete=await expectReject(()=>HandymanAccountingV263.deleteEntry("invoice-income-"+invoiceId),/invoice-linked/i);
   state=await HandymanAccountingV263.load();
   const linkedAfter=state.entries.filter(x=>x.invoiceId===invoiceId);
   check("Direct deletion of invoice-linked income is blocked",linkedBefore.length===1&&linkedDelete.rejected&&linkedAfter.length===1,"linkedBefore="+linkedBefore.length+"; rejected="+linkedDelete.rejected+"; linkedAfter="+linkedAfter.length+"; message="+linkedDelete.message);   
   const health=await HandymanAppStorageV263.health();
   check("Final dedicated database health",health.ok&&health.database===report.database&&!health.resetLocked,"healthy="+health.ok+"; database="+health.database+"; resetLocked="+health.resetLocked);
   report.ok=checks.every(x=>x.ok);report.totalChecks=checks.length;report.passed=checks.filter(x=>x.ok).length;report.failed=checks.filter(x=>!x.ok).length;report.health=health;
  }catch(e){
   report.ok=false;report.errorName=String(e&&e.name||"Error");report.errorMessage=String(e&&e.message||e);report.errorStack=String(e&&e.stack||"");
   report.totalChecks=checks.length;report.passed=checks.filter(x=>x.ok).length;report.failed=Math.max(1,checks.filter(x=>!x.ok).length);
  }
  $("out").textContent=JSON.stringify(report,null,2);$("run").disabled=false;
 }
 $("run").addEventListener("click",run);
})();
</script></body></html>
