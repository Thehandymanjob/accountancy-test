<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THA v263 Accounting Domain Lab</title><style>body{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#172235}h1{font-size:24px}button{background:#142b4a;color:#fff;border:0;border-radius:8px;padding:14px 18px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f9;border:1px solid #dce2ea;border-radius:10px;padding:12px;min-height:120px}.muted{color:#657286}</style></head><body><h1>THA v263 — Accounting Domain Integration Lab</h1><p class="muted">Synthetic data only · dedicated IndexedDB database · no LocalStorage or production access.</p><p><button id="run">Run accounting tests</button></p><pre id="out">Ready. Tap Run accounting tests.</pre>
<script src="storage-idb-v263-accounting-domain-engine.js"></script><script src="app-storage-v263-v4.js"></script><script src="v263-accounting-controller.js"></script><script src="v263-invoice-workflow-v263.js"></script>
<script>
(function(){
 const $=id=>document.getElementById(id),checks=[];
 function check(name,ok,detail){checks.push({check:name,ok:!!ok,detail:String(detail||"")});}
 async function run(){
  checks.length=0;$("run").disabled=true;$("out").textContent="Running…";
  const report={title:"THA v263 Isolated Accounting Domain Report",build:"THA-263-ACCOUNTING-DOMAIN-LAB-1",createdAt:new Date().toISOString(),database:"tha_v263_accounting_domain_lab_20261109_idb",syntheticDataOnly:true,legacyStorageAccess:false,productionAccess:false,checks};
  try{
   const init=await HandymanAccountingV263.initialize();check("IndexedDB-only initialisation",init.ok&&init.database===report.database,JSON.stringify(init));
   const token="acct-lab-"+Date.now(),customerId=token+"-customer",invoiceId=token+"-invoice";
   await HandymanAccountingV263.saveCustomer({id:customerId,name:"Synthetic Test Customer",phone:"0000000000",address:"Test only"});
   await HandymanAccountingV263.addEntry({id:token+"-expense",type:"expense",date:"2026-11-09",amount:12.34,method:"bank",category:"Materials - Test",reference:"Synthetic expense"});
   let s=await HandymanAccountingV263.load();check("Customer and ordinary expense write/read",s.customers.some(x=>x.id===customerId)&&s.entries.some(x=>x.id===token+"-expense"),"customers="+s.customers.length+"; entries="+s.entries.length);
   const saved=await HandymanInvoiceWorkflowV263.saveInvoice({id:invoiceId,customerId,number:null,date:"2026-11-09",status:"issued",paymentStatus:"unpaid",items:[{description:"Synthetic work",price:125.5}]});
   s=await HandymanAccountingV263.load();check("Invoice save with atomic sequence reservation",saved.number>0&&s.invoices.some(x=>x.id===invoiceId&&x.number===saved.number),"invoice number="+saved.number);
   await HandymanInvoiceWorkflowV263.markPaid(invoiceId,{date:"2026-11-09",method:"bank",amount:125.5});
   s=await HandymanAccountingV263.load();let linked=s.entries.filter(x=>x.invoiceId===invoiceId);check("Mark paid creates exactly one linked income",s.invoices.find(x=>x.id===invoiceId).paymentStatus==="paid"&&linked.length===1&&linked[0].amount===125.5,"linked income="+linked.length);
   await HandymanInvoiceWorkflowV263.markPaid(invoiceId,{date:"2026-11-09",method:"cash",amount:125.5});
   s=await HandymanAccountingV263.load();linked=s.entries.filter(x=>x.invoiceId===invoiceId);check("Repeated paid update does not duplicate income",linked.length===1&&linked[0].method==="cash","linked income="+linked.length+"; method="+linked[0]?.method);
   await HandymanInvoiceWorkflowV263.markUnpaid(invoiceId);
   s=await HandymanAccountingV263.load();check("Mark unpaid removes linked income and preserves invoice",s.invoices.some(x=>x.id===invoiceId&&x.paymentStatus==="unpaid")&&!s.entries.some(x=>x.invoiceId===invoiceId),"invoice retained; linked income removed");
   await HandymanInvoiceWorkflowV263.markPaid(invoiceId,{date:"2026-11-09",method:"bank",amount:125.5});
   await HandymanInvoiceWorkflowV263.softDelete(invoiceId);
   s=await HandymanAccountingV263.load();check("Soft delete retains invoice number and removes linked income",s.invoices.some(x=>x.id===invoiceId&&x.deleted===true&&x.number===saved.number)&&!s.entries.some(x=>x.invoiceId===invoiceId),"invoice retained as deleted; number="+saved.number);
   let blocked=false;try{await HandymanAccountingV263.deleteCustomer(customerId)}catch(e){blocked=/invoice/i.test(e.message)}
   check("Customer deletion blocked when invoice history exists",blocked,"blocked="+blocked);
   await HandymanAccountingV263.update(state=>{state.settings={...state.settings,businessName:"Synthetic THA",ownerName:"Test Owner"};return state;});
   s=await HandymanAccountingV263.load();check("Accounting settings save/read",s.settings.businessName==="Synthetic THA","businessName="+s.settings.businessName);
   await HandymanAccountingV263.deleteEntry(token+"-expense");
   s=await HandymanAccountingV263.load();check("Entry deletion verified",!s.entries.some(x=>x.id===token+"-expense"),"synthetic expense removed");
   const health=await HandymanAppStorageV263.health();check("Final dedicated database health",health.ok&&health.database===report.database&&!health.resetLocked,JSON.stringify(health));
   report.ok=checks.every(x=>x.ok);report.totalChecks=checks.length;report.passed=checks.filter(x=>x.ok).length;report.failed=checks.filter(x=>!x.ok).length;report.health=health;
  }catch(e){report.ok=false;report.errorName=String(e&&e.name||"Error");report.errorMessage=String(e&&e.message||e);report.errorStack=String(e&&e.stack||"");report.totalChecks=checks.length;report.passed=checks.filter(x=>x.ok).length;report.failed=Math.max(1,checks.filter(x=>!x.ok).length);}
  $("out").textContent=JSON.stringify(report,null,2);$("run").disabled=false;
 }
 $("run").addEventListener("click",run);
})();
</script></body></html>
