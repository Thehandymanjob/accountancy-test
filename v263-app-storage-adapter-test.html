<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b4a"><title>THA v263 App Storage Adapter Test</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f3f5f8;color:#172235;margin:0;padding:18px}main{max-width:720px;margin:auto;background:#fff;border:1px solid #dce2ea;border-radius:14px;padding:18px}h1{font-size:21px;color:#142b4a}button{padding:13px 18px;border:0;border-radius:9px;background:#142b4a;color:#fff;font-weight:700;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101b2b;color:#eaf0f8;padding:14px;border-radius:10px;min-height:150px;font-size:12px}.note{line-height:1.5;color:#58677b}</style>
<script src="storage-idb-v263.js?v=THA-263-IDB-ONLY-FOUNDATION-3"></script>
<script src="app-storage-v263.js?v=THA-263-APP-ADAPTER-1"></script></head>
<body><main><h1>THA v263 — Application Storage Adapter Test</h1><p class="note">This test snapshots the v263 application domains, writes a temporary accounting record, verifies read-back, and restores the original snapshot. It does not read, write, or clear LocalStorage.</p><button id="run" type="button">Run adapter test</button><pre id="out">Ready.</pre></main>
<script>
(function(){
 const button=document.getElementById("run"),out=document.getElementById("out");
 const log=value=>{out.textContent=JSON.stringify(value,null,2)};
 button.addEventListener("click",async()=>{
  button.disabled=true;out.textContent="Running…";
  const app=window.HandymanAppStorageV263;
  let original=null,restored=false;
  const report={ok:false,build:null,checks:{engineReady:false,adapterReady:false,emptyDefaults:false,writeVerified:false,readVerified:false,restoreVerified:false},errors:[]};
  try{
   const init=await app.initialize();report.engineReady=true;report.build=init.build;report.adapterReady=init.mode==="indexeddb-only"&&init.legacyImport===false;
   const names=app.domains;original=await window.HandymanStorageV263.snapshot(names);
   const initial=await app.readAll();
   report.emptyDefaults=initial.ok&&initial.emptyDatabase&&Array.isArray(initial.state.accounting.entries)&&Array.isArray(initial.state.projects.projects);
   const sample={entries:[{id:"v263-adapter-temporary",type:"income",amount:1}],customers:[],invoices:[],settings:{adapterTest:true}};
   await app.write("accounting",sample);report.writeVerified=true;
   const read=await app.read("accounting");
   report.readVerified=JSON.stringify(read)===JSON.stringify(sample);
   if(!report.readVerified)throw new Error("Accounting read-back differs from temporary test value.");
  }catch(error){report.errors.push(String(error&&error.message||error))}
  finally{
   if(original){
    try{
     const result=await app.restore(original);
     const after=await app.readAll();
     restored=result.ok&&after.emptyDatabase;
     report.checks.restoreVerified=restored;
     if(!restored)report.errors.push("Original v263 application-domain snapshot was not restored exactly to its prior empty state.");
    }catch(error){report.errors.push("Restore failed: "+String(error&&error.message||error))}
   }else report.errors.push("No original snapshot was captured; no application-domain writes were attempted.");
   report.ok=Object.values(report.checks).every(Boolean)&&report.errors.length===0;
   report.noLocalStorageAccess=true;
   log(report);button.disabled=false;
  }
 });
})();
</script></body></html>
