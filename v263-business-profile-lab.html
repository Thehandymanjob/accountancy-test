<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>THA v263 Business Profile Lab</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#172235}h1{font-size:23px}button{background:#142b4a;color:#fff;border:0;border-radius:8px;padding:14px 18px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f9;border:1px solid #dce2ea;border-radius:10px;padding:12px;min-height:160px}.muted{color:#657286}</style></head><body>
<h1>THA v263 — Business Profile Independence Lab</h1>
<p class="muted">Fresh dedicated IndexedDB database · one neutral Business Profile domain · synthetic data only · no Projects, Accounting, LocalStorage or production access.</p>
<p><button id="run">Run Business Profile tests</button></p><pre id="out">Ready. Tap Run Business Profile tests.</pre>
<script src="storage-idb-v263-business-profile-engine.js"></script><script src="app-storage-v263-business-profile-lab.js"></script><script src="v263-business-profile-controller.js"></script>
<script>
(function(){
 "use strict";const $=id=>document.getElementById(id),checks=[];
 function check(name,ok,detail){checks.push({check:name,ok:!!ok,detail:String(detail||"")});}
 async function reject(fn,re){try{await fn();return false}catch(e){return !re||re.test(String(e.message||e))}}
 async function run(){checks.length=0;$("run").disabled=true;$("out").textContent="Running Business Profile tests…";
 const report={title:"THA v263 Business Profile Independence Report",build:"THA-263-BUSINESS-PROFILE-LAB-1",database:"tha_v263_business_profile_lab_20261109_idb",syntheticDataOnly:true,legacyStorageAccess:false,productionAccess:false,checks};
 try{
  const init=await HandymanBusinessProfileV263.initialize();check("Dedicated Business Profile database initializes",init.ok&&init.database===report.database&&init.domain==="business_profile",JSON.stringify(init));
  check("Only Business Profile domain is exposed",HandymanAppStorageV263.domains.length===1&&HandymanAppStorageV263.domains[0]==="businessProfile",HandymanAppStorageV263.domains.join(","));
  check("No Projects or Accounting controllers are loaded",!window.HandymanProjectsV263&&!window.HandymanAccountingV263,"projects="+!!window.HandymanProjectsV263+"; accounting="+!!window.HandymanAccountingV263);
  const logo=new Blob(["synthetic-logo-binary"],{type:"image/png"});const profile={businessName:"Synthetic Builder Ltd",ownerName:"Synthetic Owner",phone:"07000000000",email:"profile@example.invalid",address:"Synthetic Address",logo:"data:image/png;base64,c3ludGhldGljLWxvZ28=",paymentDetails:"Synthetic bank details",customField:{retain:true}};
  const imported=await HandymanBusinessProfileV263.importLegacyProfile(profile);let loaded=await HandymanBusinessProfileV263.load();
  check("Explicit legacy-profile import preserves all known and unknown fields",imported.ok&&loaded.businessName===profile.businessName&&loaded.ownerName===profile.ownerName&&loaded.phone===profile.phone&&loaded.email===profile.email&&loaded.address===profile.address&&loaded.logo===profile.logo&&loaded.paymentDetails===profile.paymentDetails&&loaded.customField.retain===true,"fields="+Object.keys(loaded).join(","));
  await HandymanBusinessProfileV263.update({phone:"07111111111",logo:"data:image/png;base64,bmV3LWxvZ28="});loaded=await HandymanBusinessProfileV263.load();
  const contractPrintProfile=await HandymanBusinessProfileV263.load(),invoicePrintProfile=await HandymanBusinessProfileV263.load();
  check("Contract and invoice renderers can read the same current profile",contractPrintProfile.logo===loaded.logo&&invoicePrintProfile.logo===loaded.logo&&contractPrintProfile.phone===loaded.phone&&invoicePrintProfile.email===loaded.email,"logoShared="+(contractPrintProfile.logo===invoicePrintProfile.logo)+"; phone="+contractPrintProfile.phone+"; email="+invoicePrintProfile.email);
  check("Profile update is reflected on next read",loaded.phone==="07111111111"&&loaded.logo==="data:image/png;base64,bmV3LWxvZ28=","phone="+loaded.phone);
  const backup=await HandymanBusinessProfileV263.backup();check("Backup contains Business Profile only",backup.domains.length===1&&backup.domains[0]==="business_profile"&&backup.records.every(x=>x.domain==="business_profile"),"domains="+backup.domains.join(","));
  await HandymanBusinessProfileV263.update({businessName:"Temporary After Backup"});await HandymanBusinessProfileV263.restore(backup);loaded=await HandymanBusinessProfileV263.load();
  check("Profile-only restore returns original profile and logo",loaded.businessName==="Synthetic Builder Ltd"&&loaded.logo==="data:image/png;base64,bmV3LWxvZ28="&&loaded.customField.retain===true,"name="+loaded.businessName+"; logoRestored="+(loaded.logo==="data:image/png;base64,bmV3LWxvZ28="));
  const foreign={...backup,domains:["business_profile","projects"],records:[...backup.records,{domain:"projects",key:"state",value:{projects:[]}}]};
  check("Profile restore rejects a mixed Projects package",await reject(()=>HandymanBusinessProfileV263.restore(foreign),/Business Profile restore accepts only/),"mixed package rejected");
  check("Invalid profile fields are rejected",await reject(()=>HandymanBusinessProfileV263.save({businessName:123})),"non-text profile value rejected");
  const health=await HandymanAppStorageV263.health();check("Final dedicated database health",health.ok&&health.database===report.database,"healthy="+health.ok+"; counts="+JSON.stringify(health.counts));
  report.ok=checks.every(x=>x.ok);report.totalChecks=checks.length;report.passed=checks.filter(x=>x.ok).length;report.failed=checks.filter(x=>!x.ok).length;report.health=health;
 }catch(e){report.ok=false;report.errorName=String(e&&e.name||"Error");report.errorMessage=String(e&&e.message||e);report.errorStack=String(e&&e.stack||"");report.totalChecks=checks.length;report.passed=checks.filter(x=>x.ok).length;report.failed=Math.max(1,checks.filter(x=>!x.ok).length);}
 $("out").textContent=JSON.stringify(report,null,2);$("run").disabled=false;
 }$("run").addEventListener("click",run);
})();
</script></body></html>
