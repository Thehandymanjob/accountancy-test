<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THA v263 Candidate Domain Test</title><style>body{font:16px -apple-system,Arial;margin:20px;color:#172235}h1{font-size:22px}pre{white-space:pre-wrap;background:#f3f5f8;padding:14px;border-radius:8px}.ok{color:#176534}.bad{color:#a52d39}</style></head><body><h1>THA v263 Candidate — isolated domain integration test</h1><p>This page writes only to a dedicated test IndexedDB database. It does not access the production database or LocalStorage.</p><pre id="out">Running…</pre>
<script src="../v263-candidate/storage-idb-v263-candidate-test.js"></script>
<script src="../v263-strict-domain-boundary.js"></script><script src="../app-storage-v263.js"></script>
<script src="../v263-accounting-controller-diagnostic-v2.js"></script><script src="../v263-projects-controller.js"></script><script src="../v263-contracts-controller.js"></script><script src="../v263-business-profile-controller.js"></script><script src="../v263-support-controller-v2.js"></script>
<script>
(async()=>{const results=[];const test=async(name,fn)=>{try{const detail=await fn();results.push({name,pass:true,detail});}catch(e){results.push({name,pass:false,error:String(e&&e.message||e)});}};
await test("Dedicated IndexedDB ready",()=>HandymanStorageV263.ready());
await test("Business Profile independent save/read",async()=>{const x=await HandymanBusinessProfileV263.save({businessName:"Candidate Test",ownerName:"Test Owner",phone:"",email:"",address:"",logo:"data:image/png;base64,dGVzdA==",paymentDetails:""});if(x.profile.businessName!=="Candidate Test")throw Error("Profile read-back mismatch");return {domain:"business_profile",verified:true};});
await test("Projects save/read with nested subproject and Blob",async()=>{const x=await HandymanProjectsV263.save({projects:[{id:"p-test",name:"Main",subprojects:[{id:"s-test",name:"Extra Job",expenses:[{id:"e-test",amount:300,receipt:new Blob(["receipt"],{type:"text/plain"})}]}]}],workers:[],partners:[],contractors:[],companies:[],companyJobs:[],current:null,guide:"en"});const b=x.state.projects[0].subprojects[0].expenses[0].receipt;if(!(b instanceof Blob)||await b.text()!=="receipt")throw Error("Project Blob round-trip failed");return {projectCount:x.state.projects.length,subproject:"Extra Job",receiptBlobVerified:true};});
await test("Projects rejects embedded Business Profile",async()=>{try{await HandymanProjectsV263.save({projects:[],workers:[],profile:{businessName:"must not mix"}});}catch(e){if(!String(e.message).includes("legacy Business Profile"))throw e;return {crossDomainProfileRejected:true};}throw Error("Mixed profile was accepted");});
await test("Accounting state save/read",async()=>{const x=await HandymanAccountingV263.save({entries:[{id:"a-test",type:"income",amount:300}],customers:[],invoices:[],customExpenseCategories:[],settings:{}});if(x.state.entries[0].amount!==300)throw Error("Accounting mismatch");return {domain:"accounting",verified:true};});
await test("Invoice number reservation",async()=>{const n=await HandymanAccountingV263.reserveInvoiceNumber(300);if(n<301)throw Error("Counter did not reserve above minimum");return {reserved:n};});
await test("Contracts save/read",async()=>{await HandymanContractsV263.add({id:"c-test",title:"Test contract",attachment:new Blob(["contract"],{type:"text/plain"})});const c=await HandymanContractsV263.get("c-test");if(!c||await c.attachment.text()!=="contract")throw Error("Contract attachment mismatch");return {attachmentBlobVerified:true};});
await test("Support single-domain report saves",async()=>{const x=await HandymanSupportV263.saveReportWorkspace({archive:[{id:"r-test"}],notifications:[{id:"n-test"}],settings:{compact:true},workflow:{step:2}});if(!x.independentDomainWrites||x.archive[0].id!=="r-test")throw Error("Report workspace verification failed");return {independentDomainWrites:true};});
await test("Support language and metadata",async()=>{const x=await HandymanSupportV263.setLanguage("fa","candidate-v1");if(x.language!=="fa"||x.preferenceVersion!=="candidate-v1")throw Error("Language preference mismatch");return x;});
await test("Strict boundary blocks cross-domain write",async()=>{try{await HandymanV263DomainBoundary.createScope("projects").put("accounting","state",{});}catch(e){return {rejected:true};}throw Error("Cross-domain write was accepted");});
await test("Adapter rejects multi-domain transaction",async()=>{try{await HandymanAppStorageV263.writeMany({projects:{projects:[],workers:[]},accounting:{entries:[],customers:[],invoices:[]}});}catch(e){return {rejected:true};}throw Error("Multi-domain write was accepted");});
const health=await HandymanStorageV263.health();const report={build:"THA-263-CANDIDATE-DOMAIN-CUTOVER-TEST-1",database:health.database,health,pass:results.filter(x=>x.pass).length,fail:results.filter(x=>!x.pass).length,results,productionTouched:false,localStorageAccess:false,realAppUiIntegrated:false};document.getElementById("out").textContent=JSON.stringify(report,null,2);document.getElementById("out").className=report.fail?"bad":"ok";
})().catch(e=>{document.getElementById("out").textContent="FATAL: "+String(e&&e.stack||e);document.getElementById("out").className="bad";});
</script></body></html>
