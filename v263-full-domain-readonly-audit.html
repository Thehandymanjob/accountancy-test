<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THA v263 Full Domain Read-only Audit</title><style>*{box-sizing:border-box}body{margin:0;padding:18px 14px 40px;background:#f3f5f8;color:#172235;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:760px;margin-inline:auto}h1{font-size:22px}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:16px;margin:12px 0}.notice{background:#fff4d6;border-color:#e7c75f}button{border:0;border-radius:9px;padding:14px;background:#142b4a;color:white;font-weight:700;font-size:16px;width:100%;margin-top:8px}.status{font-weight:700}.good{color:#176b35}.bad{color:#a52d39}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101820;color:#e7edf5;padding:12px;border-radius:8px;font-size:12px;direction:ltr;text-align:left}</style></head><body><h1>ممیزی کامل دامنه‌های v263 ـ فقط‌خواندنی</h1><div class="card notice"><b>ایمن:</b> فقط ۵ رکورد مستقل را می‌خواند؛ هیچ نوشتن، حذف، بازیابی یا دسترسی به LocalStorage انجام نمی‌دهد.</div><div class="card"><div id="status" class="status">آماده</div><button id="run">اجرای ممیزی کامل</button><pre id="out">در انتظار</pre></div><script src="./storage-idb-v263.js"></script><script src="./v263-strict-domain-boundary.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id);$("run").onclick=async()=>{const b=$("run"),s=$("status"),o=$("out");b.disabled=true;s.textContent="در حال خواندن…";try{const e=window.HandymanStorageV263,bd=window.HandymanV263DomainBoundary;const ready=await e.ready();if(!ready||!ready.ok)throw Error("IndexedDB ready failed");const health=await e.health();const inventory=await e.snapshot(["projects","business_profile","accounting","contracts","sequences"]);const recordInventory=inventory.records.map(r=>({domain:r.domain,key:r.key,updatedAt:r.updatedAt,valueType:r.value===null?"null":Array.isArray(r.value)?"array":typeof r.value}));const specs=[["projects","projects","state","projects"],["businessProfile","business_profile","identity","businessProfile"],["accounting","accounting","state","accountingState"],["contracts","contracts","state","contracts"],["invoiceSequence","sequences","invoice-number","invoiceSequence"]];const data={};for(const [name,domain,key,scopeName] of specs){const v=await bd.createScope(scopeName).get(domain,key);data[name]=v;}const a=data.accounting,p=data.projects,c=data.contracts,bp=data.businessProfile,q=data.invoiceSequence;const excluded="project-v1-pr-1792258756429-z8fug9-pr-1792263742588-vlbgug-pr-1793445826791-s5mz7z";const report={ok:true,mode:"READ_ONLY",database:ready.database,build:ready.build,storage:{totalRecords:health.totalRecords,domainCounts:health.counts,resetLocked:health.resetLocked,records:recordInventory},domains:{projects:{recordExists:p!==null,projectCount:p&&Array.isArray(p.projects)?p.projects.length:null,workerCount:p&&Array.isArray(p.workers)?p.workers.length:null,hasCompanyJobs:!!(p&&Array.isArray(p.companyJobs)),companyJobCount:p&&Array.isArray(p.companyJobs)?p.companyJobs.length:null},businessProfile:{recordExists:bp!==null,fieldCount:bp&&typeof bp==="object"?Object.keys(bp).length:null,hasLogo:!!(bp&&bp.logo)},accounting:{recordExists:a!==null,hasEntriesArray:!!(a&&Array.isArray(a.entries)),entryCount:a&&Array.isArray(a.entries)?a.entries.length:null,customerCount:a&&Array.isArray(a.customers)?a.customers.length:null,invoiceCount:a&&Array.isArray(a.invoices)?a.invoices.length:null,experimentalOnePoundRecordPresent:a&&Array.isArray(a.entries)?a.entries.some(x=>x&&x.id===excluded):null,auditRecordPresent:!!(a&&a.migrationAudit&&Array.isArray(a.migrationAudit.excludedExperimentalEntries)&&a.migrationAudit.excludedExperimentalEntries.some(x=>x&&x.id===excluded))},contracts:{recordExists:c!==null,contractCount:c&&Array.isArray(c.contracts)?c.contracts.length:null},invoiceSequence:{recordExists:q!==null,lastInvoiceNumber:typeof q==="number"?q:null,nextInvoiceNumber:typeof q==="number"?q+1:null}},writesPerformed:false,localStorageAccess:false};s.textContent="ممیزی کامل شد؛ فقط‌خواندنی.";s.className="status good";o.textContent=JSON.stringify(report,null,2);}catch(err){s.textContent="خطا: "+err.message;s.className="status bad";o.textContent=JSON.stringify({ok:false,mode:"READ_ONLY",error:err.message,writesPerformed:false,localStorageAccess:false},null,2);}finally{b.disabled=false;}};})();</script></body></html>
