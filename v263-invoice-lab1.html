<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>THA v263 Invoice Lab 1</title><style>body{margin:0;background:#f3f5f8;color:#172235;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin:12px 0}button{border:0;border-radius:8px;padding:12px 16px;background:#142b4a;color:white;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101828;color:#e7edf7;padding:12px;border-radius:8px;font-size:12px}.muted{color:#657286;font-size:13px}</style></head><body><main><section class="card"><h2>v263 Invoice & Payment Lab 1</h2><p class="muted">Synthetic invoice only · isolated IndexedDB · no LocalStorage · production v262 untouched. This test uses the existing synthetic test customer and creates one synthetic invoice.</p><button id="run">Run invoice lifecycle test</button> <button id="copy">Copy report</button><p id="status">Ready.</p></section><section class="card"><h3>Test report</h3><pre id="report">Not run.</pre></section></main><script src="./storage-idb-v263-app-shell-lab.js?v=263app1"></script><script src="./app-storage-v263-v4.js?v=263app1"></script><script src="./v263-accounting-controller-diagnostic-v2.js?v=263app1"></script><script src="./v263-invoices-controller.js?v=263invoice1"></script><script>
'use strict';
const $=id=>document.getElementById(id);let report=null;
async function run(){const checks={};let invoiceId=null;const result={build:"THA-263-INVOICE-LAB-1",database:"tha_v263_app_shell_lab_20261109_idb",mode:"indexeddb-only",legacyImport:false,productionTouched:false,localStorageAccess:false,checks,counts:{},testedAt:new Date().toISOString()};
const check=async(name,fn)=>{try{checks[name]=await fn();}catch(e){checks[name]=false;result.errors=result.errors||{};result.errors[name]={name:e.name||"Error",message:e.message||String(e)};}};
try{
 await check("bootstrap",async()=>{const x=await HandymanAppStorageV263.initialize();return x.ok===true&&x.database===result.database;});
 await check("accountingLoad",async()=>{const s=await HandymanInvoicesV263.load();result.counts.customers=s.customers.length;return s.customers.length>0;});
 const state=await HandymanInvoicesV263.load();const customer=state.customers.find(c=>String(c.id).startsWith("lab-customer-"));
 if(!customer)throw new Error("No synthetic lab customer found. Keep existing customer records; do not create or alter a real customer.");
 await check("invoiceCreate",async()=>{const x=await HandymanInvoicesV263.create({id:"v263-invoice-lab-"+Date.now(),customerId:customer.id,customerName:customer.name,date:"2026-11-09",status:"issued",items:[{description:"Synthetic invoice test item",price:300}],vat:"none",description:"Synthetic lifecycle test"});invoiceId=x.invoice.id;return !!x.invoice&&x.invoice.number>0;});
 await check("invoiceEdit",async()=>{const x=await HandymanInvoicesV263.update(invoiceId,{description:"Synthetic invoice test item — edited",notes:"Edit persistence test"});return x.invoice.description.includes("edited")&&x.invoice.notes==="Edit persistence test";});
 await check("paymentAtomicPosting",async()=>{const x=await HandymanInvoicesV263.recordPayment(invoiceId,"2026-11-09","bank");return x.invoice.paymentStatus==="paid"&&!!x.linkedIncome&&x.linkedIncome.amount===300&&x.linkedIncome.invoiceId===invoiceId;});
 await check("paymentNoDuplicate",async()=>{const s=await HandymanInvoicesV263.load();return s.entries.filter(e=>e.type==="income"&&e.invoiceId===invoiceId).length===1;});
 await check("markUnpaidRemovesLinkedIncome",async()=>{const x=await HandymanInvoicesV263.markUnpaid(invoiceId);const s=await HandymanInvoicesV263.load();return x.invoice.paymentStatus==="unpaid"&&!s.entries.some(e=>e.type==="income"&&e.invoiceId===invoiceId);});
 await check("reloadPersistence",async()=>{const s=await HandymanInvoicesV263.load();const i=s.invoices.find(x=>x.id===invoiceId);return !!i&&i.description.includes("edited")&&i.paymentStatus==="unpaid";});
 result.invoiceId=invoiceId;result.counts.final=(await HandymanInvoicesV263.load()).invoices.length;
 }catch(e){result.fatalError={name:e.name||"Error",message:e.message||String(e)}}
 result.ok=Object.values(checks).length===7&&Object.values(checks).every(Boolean)&&!result.fatalError;
 result.checkedAt=new Date().toISOString();report=result;$("report").textContent=JSON.stringify(result,null,2);$("status").textContent=result.ok?"All invoice lifecycle checks passed.":"One or more checks failed; see report.";return result;
}
$("run").addEventListener("click",run);$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("report").textContent);$("status").textContent="Report copied."}catch(e){$("status").textContent="Clipboard unavailable; select report text manually."}});
</script></main></body></html>
