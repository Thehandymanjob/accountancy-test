<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>THA v263 Isolated Project Transfer Lab</title><style>body{margin:0;background:#f3f5f8;color:#172235;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin:12px 0}button{border:0;border-radius:8px;padding:12px 16px;background:#142b4a;color:white;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101828;color:#e7edf7;padding:12px;border-radius:8px;font-size:12px}.muted{color:#657286;font-size:13px}</style></head><body><main><section class="card"><h2>v263 Isolated Project Transfer Lab</h2><p class="muted">Dedicated new IndexedDB database: tha_v263_transfer_lab_20261109_idb. Only synthetic records are created. No old database is opened, read, changed, or cleared. No LocalStorage access. Production untouched.</p><button id="run">Run isolated transfer tests</button> <button id="copy">Copy report</button><p id="status">Ready.</p></section><section class="card"><h3>Test report</h3><pre id="report">Not run.</pre></section></main><script src="./storage-idb-v263-transfer-isolated.js?build=isolated1"></script><script src="./app-storage-v263-v4.js?build=isolated1"></script><script src="./v263-projects-controller.js?build=isolated1"></script><script src="./v263-project-accounting-transfer.js?build=isolated1"></script><script>
'use strict';const $=id=>document.getElementById(id);let report=null;
async function run(){const checks={},errors={};const result={build:"THA-263-ISOLATED-PROJECT-TRANSFER-LAB-2",database:"tha_v263_transfer_lab_20261109_idb",mode:"indexeddb-only",legacyImport:false,productionTouched:false,localStorageAccess:false,oldDatabaseOpened:false,checks,errors,counts:{},testedAt:new Date().toISOString()};const projectId="synthetic-project-transfer-"+Date.now(),subId="synthetic-extra-job-"+Date.now();
const check=async(k,fn)=>{try{checks[k]=await fn()}catch(e){checks[k]=false;errors[k]={name:e.name||"Error",message:e.message||String(e)}}};
try{
 await check("freshDedicatedDatabase",async()=>{const s=await HandymanAppStorageV263.initialize();return s.ok===true&&s.database===result.database&&HandymanStorageV263.databaseName===result.database;});
 await check("syntheticProjectAndExtraJob",async()=>{await HandymanProjectsV263.initialize();await HandymanProjectsV263.addProject({id:projectId,name:"Synthetic Transfer Project",status:"open",amount:1500,subprojects:[],income:[],expenses:[]});await HandymanProjectsV263.addSubproject(projectId,{id:subId,name:"Extra Job",amount:300,status:"open",income:[],expenses:[]});await HandymanProjectsV263.saveLedgerRecord(projectId,subId,"income",{id:"synthetic-income-300",amount:300,date:"2026-11-09",description:"Extra Job payment",method:"bank"});await HandymanProjectsV263.saveLedgerRecord(projectId,subId,"expenses",{id:"synthetic-expense-45",amount:45,date:"2026-11-09",description:"Extra Job materials",method:"cash"});const p=await HandymanProjectsV263.load();const sub=p.projects.find(x=>x.id===projectId).subprojects.find(x=>x.id===subId);return sub.amount===300&&sub.income.length===1&&sub.expenses.length===1;});
 await check("approvalRequired",async()=>{try{await HandymanProjectAccountingTransferV263.transfer({projectId,subprojectId:subId,collection:"income",recordId:"synthetic-income-300",approved:false});return false}catch(e){return /approval/i.test(e.message)}});
 await check("approvedIncomeTransfer",async()=>{const x=await HandymanProjectAccountingTransferV263.transfer({projectId,subprojectId:subId,collection:"income",recordId:"synthetic-income-300",approved:true});return x.ok&&x.type==="income"&&x.amount===300&&x.sourceRetained;});
 await check("approvedExpenseTransfer",async()=>{const x=await HandymanProjectAccountingTransferV263.transfer({projectId,subprojectId:subId,collection:"expenses",recordId:"synthetic-expense-45",approved:true});return x.ok&&x.type==="expense"&&x.amount===45&&x.sourceRetained;});
 await check("duplicateTransferBlocked",async()=>{try{await HandymanProjectAccountingTransferV263.transfer({projectId,subprojectId:subId,collection:"income",recordId:"synthetic-income-300",approved:true});return false}catch(e){return /already been transferred/i.test(e.message)}});
 await check("projectLedgerRetained",async()=>{const [p,a]=await Promise.all([HandymanProjectsV263.load(),HandymanAppStorageV263.read("accounting")]);const sub=p.projects.find(x=>x.id===projectId).subprojects.find(x=>x.id===subId);const inc=sub.income.find(x=>x.id==="synthetic-income-300"),exp=sub.expenses.find(x=>x.id==="synthetic-expense-45");const linked=a.entries.filter(x=>x.projectId===projectId);result.counts={subprojectIncome:sub.income.length,subprojectExpenses:sub.expenses.length,accountingTransfers:linked.length};return !!inc&&!!exp&&inc.amount===300&&exp.amount===45&&inc.transferredToAccounting===true&&exp.transferredToAccounting===true&&linked.length===2;});
 await check("reloadPersistence",async()=>{const [p,a]=await Promise.all([HandymanProjectsV263.load(),HandymanAppStorageV263.read("accounting")]);const sub=p.projects.find(x=>x.id===projectId).subprojects.find(x=>x.id===subId);return sub.income.some(x=>x.accountingTransferId)&&sub.expenses.some(x=>x.accountingTransferId)&&a.entries.filter(x=>x.projectId===projectId).length===2;});
 result.projectId=projectId;result.subprojectId=subId;
}catch(e){result.fatalError={name:e.name||"Error",message:e.message||String(e)}}
result.ok=Object.keys(checks).length===8&&Object.values(checks).every(Boolean)&&!result.fatalError;result.checkCount=Object.keys(checks).length;result.allChecksPassed=Object.values(checks).every(Boolean);result.checkedAt=new Date().toISOString();report=result;$("report").textContent=JSON.stringify(result,null,2);$("status").textContent=result.ok?"All isolated transfer checks passed.":"One or more checks failed; see report.";return result}
$("run").addEventListener("click",run);$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("report").textContent);$("status").textContent="Report copied."}catch(e){$("status").textContent="Clipboard unavailable; select report text manually."}});
</script></main></body></html>
