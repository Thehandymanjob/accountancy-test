<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THA v263 Recovery Reset Guard Integration Lab — Build 5</title>
<style>body{font:16px system-ui;margin:18px;line-height:1.5}button{padding:13px 18px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:12px;border-radius:8px}.note{background:#fff5d8;padding:10px;border-radius:8px}</style></head>
<body><h1>THA v263 — Recovery / Reset Guard Integration — Build 5</h1>
<p class="note"><b>Isolation:</b> Uses only <code>tha_v263_recovery_lab_idb</code>. Tests the current reset-guard recovery logic against the isolated IndexedDB engine and lab adapter. No app database or LocalStorage is accessed.</p>
<button id="run">Run recovery integration test</button><pre id="out">Ready.</pre>
<script src="./storage-idb-v263-reset-guard-lab.js?build=5"></script>
<script src="./app-storage-v263-recovery-lab.js?build=5"></script>
<script src="./v263-recovery-reset-guard-lab.js?build=5"></script>
<script>
(async()=>{
const e=window.HandymanStorageV263Lab,r=window.HandymanRecoveryV263.create(),out=document.getElementById("out"),btn=document.getElementById("run");
const result={database:e.databaseName,build:window.HandymanRecoveryV263.build,checks:{},errors:[]};
const log=()=>out.textContent=JSON.stringify(result,null,2);
const assert=(k,v)=>{result.checks[k]=!!v;log();if(!v)throw new Error("FAILED: "+k)};
const blocked=async p=>{try{await p;return false}catch(x){return /abort|transaction/i.test(String(x&&x.message||x))}};
btn.onclick=async()=>{
btn.disabled=true;result.checks={};result.errors=[];result.ok=null;log();
try{
await e.beginResetAndClear();await e.releaseResetLock();
await e.transact([
{domain:"accounting",key:"state",value:{entries:[{id:"income-1",amount:125}],customers:[{id:"c1"}]}},
{domain:"projects",key:"state",value:{projects:[{id:"p1",name:"Reset Guard Test"}]}},
{domain:"lab_unknown_domain",key:"opaque",value:{blob:new Blob(["proof"],{type:"text/plain"}),date:new Date("2026-11-08T12:00:00Z")}}
]);
const backup=await r.createBackup();
assert("Portable backup created and digest verified",backup.ok&&backup.verification.records===3);
const file=new File([backup.blob],backup.filename,{type:backup.blob.type});
const inspected=await r.inspectFile(file);
assert("Backup file inspection passes integrity validation",inspected.ok&&inspected.records===3);
const tamperedObj=JSON.parse(await backup.blob.text());tamperedObj.payload.records[0].value.entries[0].amount=999;
const tampered=new File([JSON.stringify(tamperedObj)],"tampered.json",{type:"application/json"});
let tamperRejected=false;try{await r.resetFromBackupFile(tampered)}catch(x){tamperRejected=/SHA-256/.test(String(x.message||x))}
assert("Tampered backup rejected before reset",tamperRejected&&(await e.health()).totalRecords===3);
// Simulate a write landing after the first backup comparison but immediately before lock acquisition.
const raceEngine={};
for(const name of ["ready","get","readMany","put","remove","transact","mutateMany","reserveCounter","snapshot","restore","health","selfTest","beginResetLock","clearWhileResetLocked","beginResetAndClear","releaseResetLock"]){
 raceEngine[name]=typeof e[name]==="function"?e[name].bind(e):e[name];
}
raceEngine.beginResetLock=async()=>{await e.put("accounting","race-window",{amount:777});return e.beginResetLock();};
const raceRecovery=window.HandymanRecoveryV263.createWithDependencies(raceEngine,window.HandymanAppStorageV263Lab);
const raceBackup=await raceRecovery.createBackup();
let raceRejected=false;
try{await raceRecovery.resetFromBackupFile(new File([raceBackup.blob],raceBackup.filename,{type:raceBackup.blob.type}));}
catch(x){raceRejected=/database changed before the reset lock/i.test(String(x.message||x));}
const raceValue=await e.get("accounting","race-window");
const raceHealth=await e.health();
result.raceDiagnostics={raceRejected,raceValue,raceTotalRecords:raceHealth.totalRecords,lockApi:typeof e.beginResetLock,clearApi:typeof e.clearWhileResetLocked};
assert("Concurrent write was retained",!!raceValue&&raceValue.amount===777);
assert("Concurrent write caused reset rejection",raceRejected);
assert("Concurrent write was not cleared",raceHealth.totalRecords===4);
assert("Mismatch path safely releases reset lock",await e.put("diagnostics","after-race",{ok:true}).then(x=>x.ok));
const freshBackup=await r.createBackup();
const freshFile=new File([freshBackup.blob],freshBackup.filename,{type:freshBackup.blob.type});
const reset=await r.resetFromBackupFile(freshFile);
const health=await e.health();
assert("Factory Reset locks first, re-verifies snapshot, then clears all records",reset.ok&&reset.resetLocked&&reset.recoveryRequired&&reset.lockedSnapshotVerified&&health.totalRecords===0);
assert("Normal writes remain blocked after Factory Reset",await blocked(e.put("accounting","blocked",{x:1})));
const restored=await r.restoreFromFile(file);
const after=await e.health();
const account=await e.get("accounting","state"),unknown=await e.get("lab_unknown_domain","opaque");
assert("Restore from selected backup verifies exact records",restored.ok&&restored.verified&&restored.restored===3&&after.totalRecords===3);
assert("Restore releases reset lock and resumes writes",await e.put("diagnostics","post-restore",{ok:true}).then(x=>x.ok));
assert("Unknown domain and Blob/Date survive reset recovery",unknown.blob instanceof Blob&&await unknown.blob.text()==="proof"&&unknown.date instanceof Date&&account.entries[0].amount===125);
await e.beginResetAndClear();
assert("Final lab cleanup clears records and leaves reset lock active",(await e.health()).totalRecords===0);
result.ok=Object.values(result.checks).every(Boolean);
}catch(x){result.errors.push(String(x&&x.message||x)+"\\n"+String(x&&x.stack||""));result.ok=false}
finally{log();btn.disabled=false}
};
})();
</script></body></html>
