<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THA v263 Full Reset Guard Lab</title>
<style>body{font:16px system-ui;margin:18px;line-height:1.5}button{padding:13px 18px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:12px;border-radius:8px}.note{background:#fff5d8;padding:10px;border-radius:8px}</style></head>
<body><h1>THA v263 — Full Reset Guard Lab</h1>
<p class="note"><b>Isolation:</b> This test uses only <code>tha_v263_recovery_lab_idb</code> through a separate engine build. It does not open the production database or access LocalStorage.</p>
<button id="run">Run all guarded-write tests</button><pre id="out">Ready.</pre>
<script src="./storage-idb-v263-reset-guard-lab.js?build=1"></script>
<script>
(async function(){
const e=window.HandymanStorageV263Lab,out=document.getElementById("out"),button=document.getElementById("run");
const result={database:e&&e.databaseName,checks:{},errors:[]};
function log(){out.textContent=JSON.stringify(result,null,2);}
function assert(k,v){result.checks[k]=!!v;log();if(!v)throw new Error("FAILED: "+k);}
async function rejected(p){try{await p;return false;}catch(x){return /abort|transaction/i.test(String(x&&x.message||x));}}
button.onclick=async()=>{button.disabled=true;result.checks={};result.errors=[];log();
try{
await e.ready();
await e.releaseResetLock();
await e.transact([{domain:"guardtest",key:"seed",value:{n:1}},{domain:"guardtest",key:"counter",value:0}]);
const snap=await e.snapshot(["guardtest"]);
const reset=await e.beginResetAndClear();
assert("Reset sets persistent lock and clears every record",reset.ok&&reset.remainingRecords===0&&(await e.health()).totalRecords===0);
const tests=[
["put is blocked",()=>e.put("guardtest","put",{n:2})],
["remove is blocked",()=>e.remove("guardtest","seed")],
["transact is blocked",()=>e.transact([{domain:"guardtest",key:"tx",{n:3}}])],
["mutateMany is blocked",()=>e.mutateMany([{domain:"guardtest",key:"seed",initialValue:{n:0}}],()=>[{n:4}])],
["reserveCounter is blocked",()=>e.reserveCounter("guardtest","counter",0)]
];
for(const [name,fn] of tests)assert(name,await rejected(fn()));
let restoreBlocked=false;
try{await e.restore(snap);}catch(x){restoreBlocked=true;}
assert("Restore is allowed as explicit recovery and releases lock",!restoreBlocked&&(await e.health()).totalRecords===2);
const second=await e.beginResetAndClear();
assert("Second reset re-locks and clears",second.ok&&(await e.health()).totalRecords===0);
const lockDb=await new Promise((resolve,reject)=>{const q=indexedDB.open(e.databaseName);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});
const tx=lockDb.transaction(["metadata"],"readonly"),rq=tx.objectStore("metadata").get("resetLock");
const lock=await new Promise((resolve,reject)=>{rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error);});
lockDb.close();
assert("Reset lock remains active across connections",lock&&lock.active===true);
await e.releaseResetLock();
await e.put("guardtest","after-unlock",{ok:true});
assert("Write resumes after explicit unlock",(await e.get("guardtest","after-unlock")).ok===true);
await e.beginResetAndClear();
assert("Final cleanup leaves zero lab records",(await e.health()).totalRecords===0);
result.ok=Object.values(result.checks).every(Boolean);
}catch(x){result.errors.push(String(x&&x.stack||x));result.ok=false;}
finally{log();button.disabled=false;}
};
})();
</script></body></html>
