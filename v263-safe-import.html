<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THA v263 Safe Import</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px 14px 40px;background:#f3f5f8;color:#172235;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:760px;margin-inline:auto}h1{font-size:22px}.notice,.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin:12px 0}.notice{background:#fff4d6;border-color:#e7c75f}.card h3{margin:0 0 8px}p{line-height:1.55}.meta{font-size:13px;color:#637187}button{border:0;border-radius:9px;padding:12px 15px;background:#142b4a;color:white;font-weight:700;font-size:15px;min-height:46px;width:100%;margin-top:8px}button:disabled{opacity:.45}input{width:100%;padding:12px;border:1px solid #b9c4d2;border-radius:8px;margin:8px 0}.status{font-weight:700}.good{color:#176b35}.bad{color:#a52d39}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101820;color:#e7edf5;padding:12px;border-radius:8px;font-size:12px;direction:ltr;text-align:left}
</style></head><body><h1>ورود کنترل‌شده اطلاعات به v263</h1>
<p class="notice"><b>هشدار:</b> این صفحه برای دیتابیس آزمایشی مستقل v263 است. قبل از هر ورود، فایل بررسی می‌شود؛ دامنهٔ مقصد باید خالی باشد. اگر داده‌ای از قبل وجود داشته باشد، عملیات متوقف می‌شود و بازنویسی انجام نمی‌شود. فایل‌های مبدأ تغییر نمی‌کنند.</p>
<div class="card"><div id="overall" class="status">در حال آماده‌سازی IndexedDB…</div><pre id="health">در انتظار</pre></div>
<div id="steps"></div>
<script src="./storage-idb-v263.js"></script><script src="./v263-strict-domain-boundary.js"></script><script src="./app-storage-v263.js"></script><script>
(()=>{"use strict";
const $=id=>document.getElementById(id),engine=()=>window.HandymanStorageV263,boundary=()=>window.HandymanV263DomainBoundary;
const steps=[
{id:"projects",title:"۱. پروژه‌ها و تصاویر",scope:"projects",domain:"projects",key:"state",expected:"tha_v212_migration_projects_v1",transform:d=>{if(!d||!Array.isArray(d.projects)||!Array.isArray(d.workers))throw Error("ساختار پروژه معتبر نیست.");const p={...d};delete p.profile;return p;},summary:d=>({projects:d.projects.length,workers:d.workers.length,partners:(d.partners||[]).length,contractors:(d.contractors||[]).length,companies:(d.companies||[]).length})},
{id:"profile",title:"۲. پروفایل تجاری مستقل",scope:"businessProfile",domain:"business_profile",key:"identity",expected:"derived-from-projects-v212-profile",transform:d=>{if(!d||typeof d!=="object"||Array.isArray(d))throw Error("پروفایل معتبر نیست.");const out={...d};for(const k of ["businessName","ownerName","phone","email","address","logo","paymentDetails"])if(out[k]===undefined||out[k]===null)out[k]="";return out;},summary:d=>({fields:Object.keys(d),hasLogo:!!d.logo})},
{id:"accounting",title:"۳. حسابداری",scope:"accountingState",domain:"accounting",key:"state",expected:"tha_v212_migration_accounting_v1",transform:d=>{if(!d||!Array.isArray(d.entries)||!Array.isArray(d.customers)||!Array.isArray(d.invoices))throw Error("ساختار حسابداری معتبر نیست.");const removed=d.entries.filter(x=>x&&x.id==="project-v1-pr-1792258756429-z8fug9-pr-1792263742588-vlbgug-pr-1793445826791-s5mz7z");const entries=d.entries.filter(x=>!removed.includes(x));return {...d,entries,migrationAudit:{sourceKey:"tha_v212_migration_accounting_v1",excludedExperimentalEntries:removed.map(x=>({id:x.id,amount:x.amount,reason:"User confirmed this £1 record was experimental project income and must not be imported."}))}};},summary:d=>({entries:d.entries.length,customers:d.customers.length,invoices:d.invoices.length,experimentalOnePoundExcluded:d.migrationAudit.excludedExperimentalEntries.length})},
{id:"contracts",title:"۴. قراردادها",scope:"contracts",domain:"contracts",key:"state",expected:"tha_v212_migration_contracts_v1",transform:d=>{if(!Array.isArray(d))throw Error("ساختار قراردادها معتبر نیست.");return {contracts:d};},summary:d=>({contracts:d.contracts.length})},\n{id:"sequence",title:"۵. شماره‌گذاری فاکتورها",scope:"invoiceSequence",domain:"sequences",key:"invoice-number",expected:"tha_v212_migration_invoice_sequence_v1",transform:d=>{const n=typeof d==="number"?d:Number(d);if(!Number.isSafeInteger(n)||n<0)throw Error("شمارهٔ آخر فاکتور معتبر نیست.");return n;},summary:d=>({lastInvoiceNumber:d,nextInvoiceNumber:d+1})}
];
let prepared={},profileSource=null,profileImportButton=null,profileImportStatus=null,profileImportPreview=null;
function decodeBase64(s){return atob(s)}
async function parse(file){const pkg=JSON.parse(await file.text());if(!pkg||pkg.format!=="tha-v263-legacy-domain-package-v1"||pkg.algorithm!=="SHA-256"||!pkg.payload)throw Error("قالب فایل پشتیبان معتبر نیست.");const payload=pkg.payload;if(payload.format!=="tha-v263-legacy-domain-import-v1"||!["projects","accounting","contracts","invoiceSequence"].includes(payload.domain))throw Error("دامنهٔ فایل معتبر نیست.");const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(JSON.stringify(payload)));const digest=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,"0")).join("");if(digest!==pkg.sha256)throw Error("SHA-256 فایل صحیح نیست.");return payload;}
function card(step){const el=document.createElement("div");el.className="card";el.innerHTML="<h3>"+step.title+"</h3><p class='meta'>فقط فایل v212 مربوط به همین دامنه را انتخاب کن.</p>";const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.id="file-"+step.id;const status=document.createElement("div");status.className="meta";status.textContent=step.id==="profile"?"پروفایل از فایل Projects استخراج می‌شود؛ فایل جدا لازم نیست.":"فایلی انتخاب نشده";const preview=document.createElement("pre");preview.textContent=step.id==="profile"?"پس از بررسی فایل Projects، خلاصهٔ پروفایل اینجا نمایش داده می‌شود.":"پس از بررسی فایل، خلاصهٔ رکوردها نمایش داده می‌شود.";const btn=document.createElement("button");btn.textContent=step.id==="profile"?"ورود پروفایل مستقل":"بررسی فایل و آماده‌سازی";btn.disabled=true;if(step.id==="profile"){input.hidden=true;profileImportButton=btn;profileImportStatus=status;profileImportPreview=preview;}input.addEventListener("change",async()=>{if(step.id==="profile")return;btn.disabled=true;prepared[step.id]=null;try{const f=input.files[0];if(!f) return;const p=await parse(f);const expectedDomain=step.id==="profile"?"projects":step.id;if(p.domain!==expectedDomain)throw Error("این فایل برای بخش "+step.title+" نیست.");if(step.id!=="profile"&&p.sourceKey!==step.expected)throw Error("کلید منبع فایل با نسخهٔ تأییدشده مطابقت ندارد.");const transformed=step.transform(p.data);if(step.id==="projects"){profileSource=p.data.profile||{};prepared.profile={sourceKey:"derived-from-projects-v212-profile",data:steps[1].transform(profileSource)};if(profileImportButton){profileImportButton.disabled=false;profileImportStatus.textContent="پروفایل از فایل Projects استخراج شد؛ آمادهٔ ورود مستقل";profileImportStatus.className="status good";profileImportPreview.textContent=JSON.stringify(steps[1].summary(prepared.profile.data),null,2);}}prepared[step.id]={payload:p,data:transformed};status.textContent="فایل معتبر است؛ آمادهٔ ورود مستقل";status.className="status good";preview.textContent=JSON.stringify(step.summary(transformed),null,2);btn.disabled=false;}catch(e){status.textContent="بررسی ناموفق: "+e.message;status.className="status bad";preview.textContent="";}});btn.addEventListener("click",async()=>{btn.disabled=true;try{let item=prepared[step.id];if(!item&&step.id==="profile"&&prepared.projects)item=prepared.profile;if(!item)throw Error("ابتدا فایل مربوطه را بررسی کن.");if(step.id==="profile"&&!profileSource)throw Error("ابتدا فایل Projects را بررسی کن تا پروفایل از همان فایل استخراج شود.");const db=engine();await db.ready();const sc=boundary().createScope(step.scope);const existing=await sc.get(step.domain,step.key);if(existing!==null)throw Error("داده‌ای از قبل در مقصد وجود دارد؛ برای جلوگیری از بازنویسی، ورود متوقف شد.");const data=step.id==="profile"?item.data:item.data;const value=data;await sc.put(step.domain,step.key,value);const verified=await sc.get(step.domain,step.key);if(!(await db.valuesEqual(verified,value)))throw Error("تأیید محتوای ذخیره‌شده ناموفق بود.");status.textContent="ورود و تأیید موفق شد";status.className="status good";preview.textContent=JSON.stringify({ok:true,domain:step.domain,recordKey:step.key,verified:true,summary:step.summary(value),excludedExperimentalOnePound:step.id==="accounting"?data.migrationAudit.excludedExperimentalEntries.length>0:false},null,2);btn.textContent="انجام شد ✓";}catch(e){status.textContent="ورود متوقف شد: "+e.message;status.className="status bad";btn.disabled=false;}});el.append(input,status,preview,btn);$("steps").appendChild(el);}
async function start(){try{const s=await engine().ready();if(!s.ok)throw Error("IndexedDB ready failed");const h=await engine().health();$("overall").textContent="IndexedDB آماده است · دیتابیس مستقل v263";$("overall").className="status good";$("health").textContent=JSON.stringify(h,null,2);steps.forEach(card);}catch(e){$("overall").textContent="شروع متوقف شد: "+e.message;$("overall").className="status bad";}}
start();
})();
</script></body></html>
