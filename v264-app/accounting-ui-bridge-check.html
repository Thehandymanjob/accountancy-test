<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THA v264 Accounting UI Bridge Check</title><style>body{font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;margin:0;padding:20px;background:#f4f6f9;color:#172235}main{max-width:760px;margin:auto;background:white;padding:22px;border-radius:14px}button{padding:12px 18px;background:#f4ca4e;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101b2c;color:#eaf0f8;padding:14px;border-radius:8px;min-height:120px}</style></head><body><main><h1>Accounting UI Bridge — v264</h1><p>This isolated check exercises the asynchronous IndexedDB boundary intended for the preserved accounting UI. It creates and removes synthetic records only.</p><button id="run">Run bridge checks</button><pre id="out">Waiting…</pre></main>
<script src="../v264-fresh/storage-idb-v264.js?v=264g"></script><script src="../v264-fresh/v264-strict-domain-boundary.js?v=264e"></script><script src="../v264-fresh/app-storage-v264.js?v=264e"></script><script src="../v264-fresh/v264-accounting-controller-accounting-v2.js?v=264d"></script><script src="accounting-ui-idb-bridge.js?v=1"></script>
<script>
document.getElementById('run').addEventListener('click',async()=>{
 const out=document.getElementById('out'),results={};let ids=[];
 const id='ui-bridge-'+Date.now(),customerId=id+'-customer',entryId=id+'-entry';
 try{
  const bridge=HandymanAccountingUIBridgeV264;
  const boot=await bridge.initialize();results.bootstrap=boot.ok&&boot.mode==='indexeddb-only'&&boot.legacyImport===false;
  const before=await bridge.load();
  const next=structuredClone(before);
  next.customers.push({id:customerId,name:'Synthetic UI Bridge Customer',phone:'',address:'',workAddress:'',email:''});
  next.entries.push({id:entryId,type:'expense',date:'2026-11-10',amount:12.34,method:'bank',category:'Materials - Test',reference:'Synthetic UI bridge',receiptImage:new Blob(['receipt-bridge-check'],{type:'text/plain'}),createdAt:new Date().toISOString()});
  next.customExpenseCategories=[...new Set([...(next.customExpenseCategories||[]),'Materials - Test'])];
  const committed=await bridge.commit(next);results.fullStateCommit=committed.ok&&committed.verified;
  const read=await bridge.load();
  results.customerReadBack=read.customers.some(x=>x.id===customerId);
  const savedEntry=read.entries.find(x=>x.id===entryId);
  results.entryReadBack=!!savedEntry&&savedEntry.amount===12.34;
  results.receiptBlobReadBack=savedEntry?.receiptImage instanceof Blob&&await savedEntry.receiptImage.text()==='receipt-bridge-check';
  results.extraAccountingFieldsPreserved=Array.isArray(read.thirdPartyTransactions)&&Array.isArray(read.customExpenseCategories);
  const mutated=await bridge.mutate(state=>({...state,entries:state.entries.filter(x=>x.id!==entryId),customers:state.customers.filter(x=>x.id!==customerId)}));
  results.atomicMutation=mutated.ok&&mutated.verified;
  const clean=await bridge.load();
  results.syntheticCleanup=!clean.entries.some(x=>x.id===entryId)&&!clean.customers.some(x=>x.id===customerId);
  results.noLegacyStorageAccess=!Object.keys(localStorage).some(k=>k==='tha_test226_accounting_v1');
  results.health=(await HandymanStorageV264.health()).ok;
  results.overall=Object.entries(results).filter(([k])=>k!=='health'&&k!=='overall').every(([,v])=>v===true)&&results.health===true;
  out.textContent=JSON.stringify(results,null,2);
 }catch(e){results.error=String(e?.stack||e);results.overall=false;out.textContent=JSON.stringify(results,null,2)}
});
</script></body></html>
