<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>THA v264 Fresh Database Gate</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f3f5f8;color:#172235;margin:0;padding:16px}main{max-width:760px;margin:auto}section{background:white;border:1px solid #dce2ea;border-radius:12px;padding:16px;margin:12px 0}button{padding:12px 16px;border:0;border-radius:8px;background:#17365d;color:white;font-weight:700;margin:5px}.warn{background:#fff4d6;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101c2d;color:#e8f0fb;padding:12px;border-radius:8px;font-size:12px}</style></head>
<body><main><section><h1>THA v264 — Fresh IndexedDB Gate</h1><p class="warn"><b>Isolated technical gate only.</b> This is not the full application UI. It creates a new, independent IndexedDB database. It does not import, read, or delete legacy LocalStorage data and does not touch production.</p><p><b>Database:</b> <code>the_handyman_accountancy_v264_idb</code></p><button id="init">Initialize and inspect</button><button id="smoke">Check domain controllers</button><button id="test">Run engine self-test</button><button id="boot">Run async app bootstrap</button><pre id="out">Waiting…</pre></section></main>
<script src="storage-idb-v264.js?v=264c"></script>
<script src="v264-strict-domain-boundary.js?v=264c"></script>
<script src="app-storage-v264.js?v=264c"></script>
<script src="v264-accounting-controller-accounting-v2.js?v=264c"></script>
<script src="v264-invoice-workflow-v263.js?v=264c"></script>
<script src="v264-projects-controller.js?v=264c"></script>
<script src="v264-contracts-controller.js?v=264c"></script>
<script src="v264-business-profile-controller.js?v=264c"></script>
<script src="v264-support-controller-v2.js?v=264c"></script>
<script src="v264-recovery.js?v=264c"></script>
<script src="v264-bootstrap.js?v=264c"></script>
<script>
const out=document.getElementById("out"),show=x=>out.textContent=JSON.stringify(x,null,2);
document.getElementById("init").onclick=async()=>{try{const init=await HandymanAppStorageV264.initialize(),health=await HandymanAppStorageV264.health();show({init,health,empty:health.totalRecords===0,legacyImport:false,productionTouched:false,appUiIntegrated:false});}catch(e){show({ok:false,error:String(e&&e.message||e)});}};
document.getElementById("smoke").onclick=async()=>{try{
 const results={accounting:await HandymanAccountingV264.initialize(),projects:await HandymanProjectsV264.initialize(),contracts:await HandymanContractsV264.initialize(),businessProfile:await HandymanBusinessProfileV264.initialize(),support:await HandymanSupportV264.initialize(),invoiceWorkflowLoaded:!!HandymanInvoiceWorkflowV264,recoveryLoaded:!!HandymanRecoveryV264};
 const health=await HandymanAppStorageV264.health();
 show({ok:true,results,health,empty:health.totalRecords===0,legacyImport:false,productionTouched:false,appUiIntegrated:false});
}catch(e){show({ok:false,error:String(e&&e.message||e)});}};
document.getElementById("test").onclick=async()=>{try{show(await HandymanStorageV264.selfTest());}catch(e){show({ok:false,error:String(e&&e.message||e)});}};
document.getElementById("boot").onclick=async()=>{try{show(await HandymanBootstrapV264.start());}catch(e){show({ok:false,bootstrapReady:false,error:String(e&&e.message||e),productionTouched:false,legacyImport:false});}};
</script></body></html>
