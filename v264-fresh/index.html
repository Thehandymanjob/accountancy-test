<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>THA v264 Fresh Database Gate</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f3f5f8;color:#172235;margin:0;padding:16px}main{max-width:760px;margin:auto}section{background:white;border:1px solid #dce2ea;border-radius:12px;padding:16px;margin:12px 0}button{padding:12px 16px;border:0;border-radius:8px;background:#17365d;color:white;font-weight:700;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101c2d;color:#e8f0fb;padding:12px;border-radius:8px;font-size:12px}.warn{background:#fff4d6;padding:12px;border-radius:8px}</style></head>
<body><main><section><h1>THA v264 — Fresh IndexedDB Gate</h1><p class="warn"><b>Isolated technical gate only.</b> This is not the full application UI. It creates a new, independent IndexedDB database. It does not import, read, or delete legacy LocalStorage data and does not touch production.</p><p><b>Database:</b> <code>the_handyman_accountancy_v264_idb</code></p><button id="init">Initialize and inspect</button><button id="test">Run engine self-test</button><pre id="out">Waiting…</pre></section></main>
<script src="storage-idb-v264.js"></script><script src="v264-strict-domain-boundary.js"></script><script src="app-storage-v264.js"></script>
<script>
const out=document.getElementById("out");
const show=x=>out.textContent=JSON.stringify(x,null,2);
document.getElementById("init").onclick=async()=>{try{const init=await HandymanAppStorageV264.initialize();const health=await HandymanAppStorageV264.health();show({init,health,empty:health.totalRecords===0,legacyImport:false,productionTouched:false,appUiIntegrated:false});}catch(e){show({ok:false,error:String(e&&e.message||e)});}};
document.getElementById("test").onclick=async()=>{try{show(await HandymanStorageV264.selfTest());}catch(e){show({ok:false,error:String(e&&e.message||e)});}};
</script></body></html>
